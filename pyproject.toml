[project]
name = "ai-bot-watchdog"
version = "0.2.0"
description = "A Telegram AI bot plus a watchdog bot that monitors, restarts and explains systemd services."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify
select = ["F", "E", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["bots"]
